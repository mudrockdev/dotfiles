<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
  /* Debug menu (right click on her when "DeepSeek debug" is on in the panel) */
  #menu {
    display: none; position: fixed; z-index: 10;
    grid-template-columns: 1fr 1fr; gap: 1px;
    padding: 5px; border-radius: 10px;
    background: rgba(27, 30, 38, 0.96); border: 1px solid rgba(255, 255, 255, 0.12);
    font: 12px "Inter", "Noto Sans", sans-serif; color: #e6e8ee;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45); user-select: none; cursor: default;
  }
  #menu .item { padding: 5px 10px; border-radius: 6px; white-space: nowrap; }
  #menu .item:hover { background: rgba(255, 255, 255, 0.1); }
  #menu .title { grid-column: span 2; color: #8a93a6; font-size: 11px; padding: 3px 8px 5px; }
  #menu .title:hover { background: none; }
  #menu .wide { grid-column: span 2; text-align: center; color: #9fc3ff; }
</style>
<script src="node_modules/pixi.js/dist/pixi.min.js"></script>
</head>
<body>
<script>
  const post = msg => window.webkit?.messageHandlers?.ds?.postMessage(JSON.stringify(msg));
  const log = text => post({ type: "log", text: String(text) });
  window.onerror = (m, src, line) => log(`error: ${m} (${src}:${line})`);
  window.onunhandledrejection = e => log(`rejection: ${e.reason?.stack ?? e.reason}`);

  // Cubism Core comes from ~/.var (not in the repo), the engine needs it first
  function loadScript(src) {
    return new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = ok;
      s.onerror = () => fail(new Error("could not load " + src));
      document.head.appendChild(s);
    });
  }
</script>
<script src="character.js"></script>
</body>
</html>
