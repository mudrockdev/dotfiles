<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
<script src="node_modules/pixi.js/dist/pixi.min.js"></script>
</head>
<body>
<script>
  const post = msg => window.webkit?.messageHandlers?.ds?.postMessage(JSON.stringify(msg));
  const log = text => post({ type: "log", text: String(text) });
  window.onerror = (m, src, line) => log(`error: ${m} (${src}:${line})`);
  window.onunhandledrejection = e => log(`rejection: ${e.reason?.stack ?? e.reason}`);

  // Cubism Core comes from ~/.var (not in the repo), the engine needs it first
  function loadScript(src) {
    return new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = ok;
      s.onerror = () => fail(new Error("could not load " + src));
      document.head.appendChild(s);
    });
  }
</script>
<script src="character.js"></script>
</body>
</html>
